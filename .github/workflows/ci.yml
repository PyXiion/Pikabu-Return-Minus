name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Bundle is valid JavaScript
        run: node --check dist/index.js
      - name: Committed dist/index.js is up to date
        run: |
          if ! git diff --exit-code -- dist/index.js; then
            echo "::error::dist/index.js is stale. Run 'npm run build' and commit the result."
            exit 1
          fi
      - name: Userscript metadata has update URLs
        run: |
          grep -q '^// @updateURL ' dist/index.js
          grep -q '^// @downloadURL ' dist/index.js
          grep -q '^// ==UserScript==' dist/index.js
